<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="100%" height="100%">
  <defs>
    <linearGradient id="sbNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="sbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Left Compact Crest -->
  <g transform="translate(36, 35) scale(0.32)">
    <!-- Laurel Wreath -->
    <g fill="#38bdf8" opacity="0.9">
      <path d="M -60,32 C -72,12 -76,-16 -66,-52 C -62,-40 -54,-24 -46,-12 C -56,4 -58,20 -60,32 Z"/>
      <path d="M -66,-16 C -77,-28 -80,-52 -72,-76 C -67,-64 -56,-52 -48,-40 C -58,-28 -62,-20 -66,-16 Z"/>
      <path d="M -56,-56 C -66,-72 -66,-96 -52,-112 C -48,-100 -40,-84 -30,-76 C -42,-68 -50,-60 -56,-56 Z"/>
      <path d="M 60,32 C 72,12 76,-16 66,-52 C 62,-40 54,-24 46,-12 C 56,4 58,20 60,32 Z"/>
      <path d="M 66,-16 C 77,-28 80,-52 72,-76 C 67,-64 56,-52 48,-40 C 58,-28 62,-20 66,-16 Z"/>
      <path d="M 56,-56 C 66,-72 66,-96 52,-112 C 48,-100 40,-84 30,-76 C 42,-68 50,-60 56,-56 Z"/>
    </g>
    <!-- Flame -->
    <path d="M 0,-104 C -10,-92 -11,-76 -3,-64 C -2,-56 2,-56 3,-64 C 11,-76 10,-92 0,-104 Z" fill="url(#sbGold)"/>
    <path d="M -13,-62 L 13,-62 L 8,-48 L -8,-48 Z" fill="url(#sbGold)"/>
    <!-- Mortarboard -->
    <polygon points="0,-22 52,0 0,22 -52,0" fill="#ffffff" transform="translate(0,-76)"/>
    <ellipse cx="0" cy="-76" rx="3.6" ry="2.8" fill="url(#sbGold)"/>
    <path d="M 0,-76 Q -30,-68 -37,-46" fill="none" stroke="url(#sbGold)" stroke-width="2.5"/>
    <!-- Open Book -->
    <g transform="translate(0, 12)">
      <path d="M -45,18 C -22,21 -5,11 0,6 C 5,11 22,21 45,18 L 45,-19 C 22,-16 5,-26 0,-29 C -5,-26 -22,-16 -45,-19 Z" fill="#0284c7"/>
      <path d="M -42,14 C -22,17 -5,7 0,3 L 0,-26 C -5,-22 -22,-13 -42,-16 Z" fill="#ffffff"/>
      <path d="M 42,14 C 22,17 5,7 0,3 L 0,-26 C 5,-22 22,-13 42,-16 Z" fill="#ffffff"/>
    </g>
    <!-- EST Banner -->
    <rect x="-48" y="48" width="96" height="18" rx="3" fill="#0f172a" stroke="url(#sbGold)" stroke-width="1.5"/>
    <text x="0" y="60.5" font-family="'Cinzel', serif" font-size="8.5" font-weight="700" fill="#fbbf24" letter-spacing="1.5" text-anchor="middle">EST. 1995</text>
  </g>

  <!-- Typography Right -->
  <g transform="translate(76, 0)">
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', 'Merriweather', 'Georgia', serif" font-size="20" font-weight="800" fill="currentColor" letter-spacing="0.5">Agrabad</text>
    <text x="0" y="50" font-family="'Cinzel', 'Playfair Display', 'Merriweather', 'Georgia', serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">Degree College</text>
    <text x="0" y="62" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="1.8">CHATTOGRAM • EST. 1995</text>
  </g>
</svg>
